name: Claude review

# Reviews every PR when it opens and on each new push. Read-only on code; it only comments.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first: its rules are binding
            (never publish twice, "posted" means live, never log tokens, web/ gets
            only the publishable key, mirrors validation.py <-> web/src/validation.ts).
            If the PR links a spec or plan under docs/superpowers/, check the code against it.

            Report only real problems: bugs, data loss, double posts, security, missing
            tests for risky logic. Skip style nits. Use inline comments on the exact lines,
            and one short top-level summary. Say plainly if you found nothing important.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
